root: /var/lib/luk

listen:
  intake:                       # uploads, pinned luk clients
    addr: 0.0.0.0:8443
    host: [lukd.vm]
    tls:
      mode: self
      cert: tls/tls.crt
      key: tls/tls.key
      host: lukd.vm
      algorithm: ed25519        # the default
  download:                     # browsers: ecdsa-p256
    addr: 0.0.0.0:443
    host: [drop.lukd.vm, publish.lukd.vm]
    tls:
      mode: self
      algorithm: ecdsa-p256
      cert: tls/download.crt
      key: tls/download.key
      host: drop.lukd.vm
  # secure:                     # private files (luk send --private), fetched by luk get
  #   addr: 0.0.0.0:8444
  #   host: [secure.lukd.vm]
  #   tls:                        # self or files: the luk:// URLs carry the pin
  #     mode: self
  #     cert: tls/secure.crt
  #     key: tls/secure.key
  #     host: secure.lukd.vm
  # proxied:                    # plain HTTP behind a reverse proxy
  #   addr: 127.0.0.1:8081
  #   host: [drop.example.com]
  #   public: https://drop.example.com
  # web:                        # browsers: a Let's Encrypt certificate (HTTP-01)
  #   addr: 0.0.0.0:443
  #   host: [drop.example.com]    # the certificate names; no wildcard, no IP
  #   tls:
  #     mode: acme
  #     email: ops@example.com    # optional
  #     # Tests: https://acme-staging-v02.api.letsencrypt.org/directory
  #     directory: https://acme-v02.api.letsencrypt.org/directory   # the default
  #     # eab: {kid: KEY_ID, key_file: /etc/site/lukd/eab.key}       # CAs that need it; or key: inline
  # http:                         # needed by acme: challenges, 308 to https
  #   addr: 0.0.0.0:80
  #   acme: true

# Defaults, shown for reference.
limits:
  conn:
    max: 1024
    idle: 60s
  header:
    timeout: 10s
  queue:
    reserve: 1G
  failed:
    age: 3d
  channel:                      # the channel sessions of luk (handshake, then one operation)
    auth: 60s                   # from the handshake to its signed operation (a hardware key touch)
    pending: 1024               # sessions without their operation; the oldest goes for a new one
    idle: 2m                    # a session that is no upload, after its operation
  uploads:                      # uploads in parts open at once
    total: 256
    identity: 8                 # per identity

log:
  level: info                   # debug, info, warn, error; SIGHUP applies a change

# Any part of this file can also live in config.d/*.yaml next to it:
# named entries (listen, endpoint, pipeline, storage, expose, auth.keys,
# auth.ca) merge by name, other values are set in one file only.
#
# Plain keys can also live in ssh.d/<name>.pub next to it, one key per
# line (deploy/ssh.d/robert.socha.pub.example); a name is defined either
# here or in ssh.d. CA keys can live in ssh.d/ca/host/<name>.pub and
# ssh.d/ca/user/<name>.pub, one key per line (rotation)
# (deploy/ssh.d/ca/host/hosts.pub.example); an auth.ca entry with
# name and revoked but no key holds the revocations of such a CA.
auth:
  clock_skew: 1m                 # default 1m, at most 1h
  nonces: /run/luk/nonces        # nonce cache directory on a tmpfs (default)
  keys:
    - name: robert.socha
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILfWnf2l8r4MBD1t4Rnk3fF9BGDtA+LubieHdJSa5e6n Robert Socha"
  ca:
    - name: hosts
      type: host
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILfWnf2l8r4MBD1t4Rnk3fF9BGDtA+LubieHdJSa5e6n example-ca"

endpoint:
  backup:
    listen: intake
    endpoint: /backup
    path: queue/backup
    allow: [robert.socha, "hosts:*"]
    respond: accept
    limits:
      body:
        size: 50G
        idle: 2m                # the default: a part without received bytes for it fails
        rate: 64K               # the default: a part arrives within its size / rate (0 = off)
    parts:                      # how an upload goes in parts; the defaults
      size: 8M                  # a multiple of 64K, 64K to 2G-64K
      parallel: 4               # parts in flight at once, at most (1 to 64)
    # backup:                   # who may set the luk send --backup hostname; absent = anyone, any
    #   hostname:
    #     any: [robert.socha]   # may send any hostname
    #     principal: ["hosts:*"]   # only one of the principals of its own certificate
    # quota:                    # a token bucket per identity (key, or CA + Key ID); lukd quota ls / explain
    #   mode: passive           # enforce (default) or passive: account and log, never refuse
    #   rate: 10G/1d            # refill rate of the catch-all: <size>/<duration>
    #   burst: 50G              # capacity, the largest single upload; default the size of rate
    #   class:                  # optional; of several matching classes the lowest applies
    #     - name: large
    #       members: ["hosts#db*.example.org", robert.socha]   # allow syntax; <ca>#<glob> matches the Key ID
    #       rate: 50G/1d
    #       burst: 100G
  drop:
    listen: intake
    endpoint: /drop
    path: queue/drop
    allow: [robert.socha]
    respond: url
    storage: drop
    limits:
      body:
        size: 2G
    # Capabilities are lists of identities (allow syntax, "*" = every
    # identity lukd knows) granted on top of allow; absent or [] = no one.
    # pretty:                   # luk send --pretty-url (proquint .Random)
    #   allow: ["*"]            # required: who may ask for it
    #   bits: 64                # 64 to 128, rounded up to a multiple of 16; default 64
    link:                       # what the owner may do with a link (luk link); respond url only
      remove: ["*"]             # luk link --rm
      ttl: ["*"]                # luk link --ttl (the storage needs ttl.user)
      replace: []               # luk link --file/--stdin, and luk send --mutable
      list: ["*"]               # luk link ls: the links of the caller on this endpoint
    # private:                  # private uploads; the storage needs protect
    #   owner: ["*"]            # luk send --private: only the uploader downloads it
    #   any: [robert.socha]     # luk send --private --any: every identity the protect expose allows
    # secret:                   # luk send --secret kept in RAM: its own queue and storage,
    #                           # no pipeline of the endpoint runs for it
    #   allow: ["*"]            # required: whose --secret goes here; anyone else's is an
    #                           # upload as to an endpoint without secret
    #   path: /run/luk/volatile/queue
    #   storage: volatile
    #   reserve: 16M            # free space kept on the tmpfs (default 16M), in place of limits.queue.reserve
    # permanent:                # luk send --permanent NAME: a URL that always serves the version published last
    #   path: permanent         # URL prefix under the expose of the storage (default permanent);
    #                           # unique among the endpoints of one storage
    #   names:                  # allocated in the config only; nothing else is ever published
    #     revocation/hosts.krl: # an exact name
    #       allow: [robert.socha]   # required: who may publish it (and the endpoint allow)
    #     builds/*:             # a pattern (path.Match, * within one element); an exact entry wins,
    #                           # else the pattern with the most literal characters
    #       allow: ["hosts:*"]
    #       max: 50             # distinct names it may hold (default 100)

pipeline:
  archive:
    endpoint: [backup]
    tags: [prod]
    queue:
      group: backup             # pipelines of one upload in the same group run in order
      order: 1
    steps:
      - store: archive
  devdb:
    endpoint: [backup]
    tags: [prod, devdump]
    timeout: 2h
    queue:
      group: backup
      order: 2                  # starts once archive succeeded for the upload
      concurrency: 1            # at most this many devdb runs at once (all uploads; default 1)
    steps:
      - store: archive
      - run: /opt/luk/dbdump
      - store: publish
  secure:
    endpoint: [backup]
    tags: [secure]
    steps:
      - run: /opt/luk/gpg-encrypt
        env:
          RECIPIENTS: "robert@example.net"
      - store: archive
  # s3copy:
  #   endpoint: [backup]
  #   steps:
  #     - run: /opt/luk/s3copy
  #       tee: true             # only consumes the set: out/ stays empty, the next step gets the same files
  #     - store: archive
  # s3upload:
  #   endpoint: [backup]
  #   steps:
  #     - relay: s3-upload        # lukd run runs job s3-upload (/etc/site/lukd/run.d/s3-upload.yaml) on the set; the next step gets the same files
  #     - store: archive
  # sealed:                     # the built-in encrypt step (needs gpg below)
  #   endpoint: [backup]
  #   steps:
  #     - encrypt:
  #         wkd: [robert@example.net]     # keys from the Web Key Directory
  #         key: [matt@example.com]       # keys from gpg.keys
  #         strict: false                 # true: any unusable recipient fails
  #         # Very insecure, legacy receivers only (doc/encryption.md): the passwords
  #         # sit in /etc/site/lukd/password.d/<name> (root:luk 0640) on this server.
  #         insecure:
  #           symmetric: [receiver-a]       # password receiver-a also decrypts the .gpg files
  #           openssl:                      # matching files only as <name>.enc, no integrity check:
  #             key: receiver-a             # openssl enc -d -aes-256-cbc -pbkdf2 -in X.enc -out X -pass file:pw
  #             files: ['*-latest.sql.zst'] # globs on the file name as it enters the step
  #     - store: archive
  drop:
    endpoint: [drop]
    steps:
      - store: drop

storage:
  archive:
    type: local
    base: storage/archive
    path: "{{ .Sender }}/{{ .Year }}/{{ .Month }}/{{ .Day }}/{{ .File }}"
    ttl:
      max: 21d                  # fixed lifetime: the client ttl is ignored
    # retention:                # files kept per series (pipeline, origin, file name);
    #                           # the first rule whose origin globs match applies,
    #                           # the rest of the series is pruned (UTC buckets);
    #                           # needs conflict version (default) or reject
    #   - origin: ["db1-prod", "*-prod"]
    #     keep: {last: 3, daily: 14, weekly: 8, monthly: 12, yearly: 2}
    #   - origin: ["*-stage"]
    #     keep: {daily: 7, within: 2d}   # and every file of the last 2 days
    #   - keep: {daily: 7, weekly: 4}   # no origin: every other origin (last rule)
    # watch:                    # monitoring per series (status.json, lukd status,
    #                           # checkmk); the first rule whose origin and file
    #                           # globs match applies, unmatched series are not
    #                           # watched; thresholds are these values only
    #   - origin: ["db1-prod"]  # absent: any origin
    #     file: ["db.sql*"]     # absent: any file name
    #     every: 26h            # newest copy older: CRIT
    #     size: {min: 2G, max: 20G, step: 500M}   # min/max: CRIT, step: WARN
    #     same: 3               # 3 newest copies with one sha256: WARN
    #   - origin: ["*-stage"]
    #     every: 50h
    #     size: {min: 100M}
  publish:
    type: local
    base: storage/publish
    path: "{{ .File }}"
    expose: publish
    cleanup:
      age: 14d                  # files without an expiry go after 14 days
  drop:
    type: local
    base: storage/drop
    path: "{{ .Random }}"
    expose: drop
    # protect: secure           # the expose (auth.ssh) of the private files
    shard: 2
    # hardlink: true            # one copy per content: uploads with the same sha256
    #                           # are hardlinks of one object (default); false
    #                           # stores separate files
    # links:
    #   max: 100                # most names with one content per identity
    #                           # (default 100; with hardlink only), 429 above it
    ttl:
      user: true                # the client ttl counts, clamped to min and max
      min: 1h
      max: 7d                   # also the lifetime without a client ttl
    # random:                   # .Random characters (default 32 characters, no look-alikes)
    #   alphabet: "abcdefghjkmnpqrstuvwxyz23456789"
    #   length: 26              # default: the shortest with 128 bits
  # vault:                      # backups downloaded with luk get (files and directories),
  #   type: local               # signed by the identities vault allows
  #   base: storage/vault
  #   path: "{{ .Sender }}/{{ .Year }}/{{ .File }}"
  #   expose: vault             # an expose with auth.ssh: every file, signed requests only
  #   # protect: secure-vault   # private files keep their own auth.ssh expose
  # volatile:                   # the secrets of endpoint drop, on the tmpfs /run
  #   type: local
  #   base: /run/luk/volatile/storage
  #   path: "{{ .Random }}"
  #   expose: volatile
  #   ttl: {user: true, min: 1h, max: 7d}

expose:
  drop:
    listen: download            # [download, proxied] with the proxied listener
    path: /d/
    # plain: true               # no auth on purpose: silences the catalog and index warnings
    # index: true               # HTML listing of the directory URLs (public files only;
    #                           # not with shard on the storage)
  publish:
    listen: download
    path: /magento/
    auth:
      basic:
        # Example only (user dev, password dev); generate your own with
        # htpasswd -nbB <user> <password>.
        - 'dev:$2y$05$TpFzQdt1oY6UgSKCZGgt8eCbBXDAuiQxNl13XDuDnYKUSuIC9O79W'
  # volatile:                   # nested in /d/ of drop: the longest path wins, and
  #   listen: download          # drop never stores a name under volatile/
  #   path: /d/volatile/
  # secure:                     # the private files of drop: signed luk get requests only
  #   listen: secure
  #   path: /
  #   auth:
  #     ssh:
  #       allow: ["*"]          # who gets "any" files: * is every identity lukd knows;
  #                             # names and <ca>:<glob> as in an endpoint allow
  # vault:                      # the storage expose of vault: every public file and a
  #   listen: secure            # signed JSON listing of the directories (luk get URL/);
  #   path: /v/                 # no index; the first listener needs an https public URL
  #   auth:
  #     ssh:
  #       allow: [robert.socha, "hosts:*"]

# Keys of encrypt steps.
# gpg:
#   keys: /etc/site/lukd/gpg.d   # the default; *.asc, *.gpg, *.pgp, *.key public keys of `key` recipients
#   wkd:
#     cache: 1d                 # WKD keys cached in <root>/gpg-cache (default 1d)
