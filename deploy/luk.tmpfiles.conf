# State directory of lukd, the layout of Service and State in doc/SPEC.md.
# Installed by the lukd package as /usr/lib/tmpfiles.d/luk.conf; by hand,
# install it as /etc/tmpfiles.d/luk.conf and run systemd-tmpfiles --create luk.conf.

# The lukd root: luk reaches its data, nobody else lists it. Shared by
# lukd-receive.service and lukd-process.service (both grouped by
# lukd.service).
d /var/lib/luk 0750 root luk -

# Everything luk keeps: the queue, the storage, the TLS and ACME keys.
d /var/lib/luk/data 0750 luk luk -

# Workspaces of lukd run (<root>/root/job, made by its helper units), on
# the same btrfs. Not luk's: root passes through (0711), nobody lists it.
d /var/lib/luk/root 0711 root root -

# Directory of the lukd run socket (deploy/lukd-run.socket): luk may
# reach the socket, nobody else may list it.
d /run/luk 0750 root luk -

# Queue and storage of the secrets kept in RAM (endpoint.<n>.secret, see
# Volatile secrets in doc/SPEC.md), on the tmpfs /run: emptied by a reboot.
d /run/luk/volatile 0700 luk luk -

# Nonce cache of the receive role (auth.nonces), on the tmpfs /run: a
# restart of lukd keeps it, a reboot empties it.
d /run/luk/nonces 0700 luk luk -

# Count of leftover workspaces of lukd run (count.json, written by its
# helper units, read by lukd process for status.json).
d /run/luk/workspaces 0750 root luk -
